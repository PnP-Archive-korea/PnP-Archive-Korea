name: Notion 동기화

on:
  # 1) 1시간마다 자동 실행 (UTC 기준, 매시 정각)
  schedule:
    - cron: "0 * * * *"
  # 2) Actions 탭에서 버튼으로 즉시 실행
  workflow_dispatch:
  # 3) 코드를 수정해 push할 때도 최신 데이터로 갱신
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Notion에서 games.json + 정적 SEO 파일 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # 커스텀 도메인을 붙이면 저장소 Settings → Variables에 SITE_URL을 등록하세요.
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.mjs

      - name: 변경된 경우에만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # games.json 외에 sitemap.xml / robots.txt / game/* 도 함께 커밋합니다.
          git add -A games.json sitemap.xml robots.txt game
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "chore: Notion 데이터 동기화 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
