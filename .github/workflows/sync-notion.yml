name: Notion 동기화

on:
  # 1) 1시간마다 자동 실행 (UTC 기준, 매시 정각)
  schedule:
    - cron: "0 * * * *"
  # 2) Actions 탭에서 버튼으로 즉시 실행
  workflow_dispatch:
  # 3) 코드를 수정해 push할 때도 최신 데이터로 갱신
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # 주의: cache:"npm"을 여기 넣으면 안 된다 — 이 옵션은 package-lock.json
          # (또는 npm-shrinkwrap.json/yarn.lock)이 저장소에 이미 있어야 캐시 키를
          # 계산할 수 있는데, 지금은 그 락파일 자체가 없어서(최초 실행 전) 이
          # 단계가 "Dependencies lock file is not found" 에러로 즉시 실패한다.
          # package-lock.json이 한 번 커밋되고 나면(아래 커밋 단계가 자동으로
          # 포함시킨다) 그때 다시 추가해도 된다.

      # 썸네일 파이프라인(sharp, pdf-to-img) 추가로 2026-08-31부터 의존성이 생겼습니다.
      # package-lock.json이 아직 없어 우선 npm install을 씁니다 — 한 번 실행되고 나면
      # 커밋되는 package-lock.json을 리포에 넣고 npm ci로 바꾸는 걸 권장합니다.
      - name: 의존성 설치
        run: npm install

      - name: Notion에서 games.json + 정적 SEO 파일 + 썸네일 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # 커스텀 도메인을 붙이면 저장소 Settings → Variables에 SITE_URL을 등록하세요.
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.mjs

      - name: 변경된 경우에만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # games.json 외에 sitemap.xml / robots.txt / game/* / assets/thumbs/* /
          # review-queue.json(운영자 검토 큐) / review.html(검토 큐 화면, 최초 1회 후엔
          # 내용이 안 바뀌지만 add -A라 매번 넣어도 무해합니다)도 함께 커밋합니다.
          git add -A games.json sitemap.xml robots.txt game assets/thumbs review-queue.json review.html package-lock.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "chore: Notion 데이터 동기화 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
