<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 · PnP 아카이브 KOREA</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#FAF6EF;--surface:#fff;--main:#C4593A;--navy:#2E3A4E;--text:#3B322C;--muted:#8A7E74;--line:#E7DFD2}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;line-height:1.65}
.wrap{max-width:480px;margin:0 auto;padding:48px 24px;text-align:center}
.code{font-size:15px;font-weight:800;letter-spacing:.06em;color:var(--main)}
h1{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.02em;margin:14px 0 10px}
p{color:var(--muted);font-size:15.5px}
.btn{display:inline-block;margin-top:28px;background:var(--main);color:#fff;padding:14px 28px;border-radius:999px;font-weight:700;text-decoration:none}
.btn:hover{opacity:.92}
.dice{font-size:42px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="dice">🎲</div>
  <div class="code">404</div>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 더 이상 존재하지 않는 페이지예요.<br>게임 아카이브에서 다시 찾아보세요.</p>
  <a class="btn" href="/">← PnP 아카이브 KOREA로 돌아가기</a>
</div>
</body>
</html>
